appId: com.mbcnfc
---
# 08 - Error: Insufficient Balance
# Register card with no top-up, check in, wait, then try checkout — expect insufficient balance

# Start at role switcher
- assertVisible: 'Select Operating Role'

# Register a card (balance starts at 0)
- tapOn: 'Station'
- tapOn: 'Register'
- tapOn:
    label: 'Tap Card to Register'
- extendedWaitUntil:
    visible: 'Success'
    timeout: 5000

# Check in at Gate
- tapOn:
    label: 'Go back'
- tapOn: 'Gate'
- tapOn:
    label: 'Tap Card to Check In'
- extendedWaitUntil:
    visible: 'Check-in Successful'
    timeout: 5000

# Try checkout at Terminal — should show insufficient balance
- tapOn:
    id: 'gate-scan-another'
- tapOn:
    label: 'Go back'
- tapOn: 'Terminal'
- tapOn:
    label: 'Tap Card to Check Out'
- extendedWaitUntil:
    visible: 'Insufficient balance'
    timeout: 5000

- takeScreenshot: '08-error-insufficient-balance'
- assertVisible: 'Insufficient balance'
- assertVisible: 'Required Fee'
- assertVisible: 'Available Balance'
