appId: com.mbcnfc
---
# 06 - Scout: Inspect Card
# Navigate to Scout, tap RadarZone, assert card info visible

- tapOn:
    label: 'Go back'
- tapOn: 'Scout'
- assertVisible: 'The Scout'
- takeScreenshot: '06-scout-inspect-ready'

# Tap RadarZone to inspect
- tapOn:
    label: 'Inspect'

# Wait for card info
- extendedWaitUntil:
    visible: 'Member Card Information'
    timeout: 5000

- takeScreenshot: '06-scout-inspect-result'
- assertVisible: 'Member Card Information'
- assertVisible: 'Balance'
- assertVisible: 'Status'
