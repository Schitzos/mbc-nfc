appId: com.mbcnfc
---
# 04 - Gate: Check In
# Navigate to Gate, tap RadarZone, assert check-in success

- tapOn:
    accessibilityLabel: 'Go back'
- tapOn: 'Gate'
- assertVisible: 'The Gate'
- takeScreenshot: '04-gate-checkin-ready'

# Tap RadarZone to check in
- tapOn:
    accessibilityLabel: 'Tap Card to Check In'

# Wait for success
- extendedWaitUntil:
    visible: 'Check-in Successful'
    timeout: 5000

- takeScreenshot: '04-gate-checkin-success'
- assertVisible: 'Check-in Successful'
- assertVisible: 'Parking'
