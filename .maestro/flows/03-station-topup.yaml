appId: com.mbcnfc
---
# 03 - Station: Top Up Balance (50k preset)
# Switch to Top Up tab, select 50k preset, tap RadarZone

- tapOn: 'Station'
- assertVisible: 'The Station'

# Switch to Top Up tab
- tapOn: 'Top Up'
- assertVisible: 'Top Up Amount'

# Tap 50k preset button
- tapOn: '50k'
- takeScreenshot: '03-station-topup-50k-selected'

# Tap RadarZone to top up
- tapOn:
    label: 'Tap Card to Top Up'

# Wait for success
- extendedWaitUntil:
    visible: 'Success'
    timeout: 5000

- takeScreenshot: '03-station-topup-success'
- assertVisible: 'Success'
